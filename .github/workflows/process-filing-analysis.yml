name: Process Filing Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process queued filing analysis requests
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENARENA_BASE_URL: https://aiopenarena.thomsonreuters.com
          OPENARENA_BEARER_TOKEN: ${{ secrets.OPENARENA_BEARER_TOKEN }}
          OPENARENA_FILINGS_WORKFLOW_ID: ${{ secrets.OPENARENA_FILINGS_WORKFLOW_ID || '8c608893-8fd4-4c0d-9f71-64ef91091c85' }}
          OPENARENA_TIMEOUT_SECONDS: 180
          REFRESH_CIK_LOOKUP: false
        run: python scripts/process_analysis_requests.py --process --limit 3

      - name: Commit filing analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/filing_analysis_sessions.json data/cik_lookup_cache.txt
          if git diff --cached --quiet; then
            echo "No filing analysis result changes to commit."
          else
            git commit -m "Update filing analysis sessions"
            git pull --rebase origin main
            git push origin main
          fi
